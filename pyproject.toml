[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwopus-agent"
version = "0.1.0"
description = "A modular local AI agent framework for planning, tool use, memory, reflection, skills, and research workflows."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Qwopus-Agent Contributors" }
]
dependencies = [
  # 原因：账号密码不能使用快速摘要或可逆加密保存，Apple Silicon 本地部署也需要抗 GPU 的密码哈希。
  # 作用：按 OWASP 建议使用 Argon2id，并由库自动生成每个密码的独立 salt。
  "argon2-cffi>=23.1,<26",
  # 原因：统一报告模块必须输出可查看的真实 PNG/SVG，而不是图表描述文件。
  # 作用：使用无窗口 Agg 后端生成跨平台图表，并保持 UI 只负责下载。
  "matplotlib>=3.8,<4",
  # 原因：知识图谱需要有向多关系路径遍历，同时保持本地持久化和独立测试。
  # 作用：提供实体节点、关系边、邻域和多跳路径算法。
  "networkx>=3.2,<4",
  # 原因：MiniRAG 的持久化向量层使用官方 vendor 代码选择的 NanoVectorDB。
  # 作用：新环境安装项目后可以直接创建和恢复本地语义索引。
  "minirag-hku>=0.0.2,<0.1",
  "nano-vectordb>=0.0.4,<0.1",
  "numpy>=1.26,<3",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pydantic>=2.8",
  "pypdf>=5.0",
  "python-dotenv>=1.0",
  "python-docx>=1.1",
  # 原因：PDF 是报告模块的正式输出，不能只在开发测试环境偶然拥有生成依赖。
  # 作用：使用 Unicode 字体和自动分页生成完整、可搜索的多语言 PDF。
  "reportlab>=4,<6",
  # 原因：运行时依赖 smolagents 1.x 的 RunResult、ToolCallingAgent 和 CodeAgent 合同。
  # 作用：允许兼容的 1.x 修复版本，同时避免未来 2.x 被静默安装并破坏 Agent 执行。
  "smolagents>=1.26.0,<2",
  # 原因：知识检索需要独立于聊天 LLM 的多语言本地 embedding。
  # 作用：Gemma、Qwen 或其他生成模型切换时，已有向量索引和检索接口保持稳定。
  "sentence-transformers>=5.0,<6",
]

[project.scripts]
qwopus-agent = "qwopus_agent.cli:main"
qwopus-api = "qwopus_agent.api.launcher:main"
qwopus-smolagents-smoke = "qwopus_agent.integrations.smolagents_smoke:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  # 原因：Starlette 1.3 的 TestClient 已弃用旧 httpx 兼容路径。
  # 作用：API 测试使用官方 httpx2 传输层，不产生弃用警告。
  "httpx2>=2.7,<3",
  "ruff>=0.6.0",
  "mypy>=1.10",
  # 原因：核心数据、图谱和 Excel 模块都启用了 strict mypy，运行库本身不包含完整类型。
  # 作用：开发环境可以真正执行严格类型检查，而不是被第三方缺失 stubs 淹没。
  "pandas-stubs>=2.2",
  "types-networkx>=3.2",
  "types-openpyxl>=3.1",
  # 原因：ReportLab 本体不发布 py.typed，新增正式 PDF 代码会使 strict mypy 失去类型入口。
  # 作用：保持报告模块接受与其余源码相同的静态类型检查。
  "types-reportlab>=4"
]
api = [
  # 原因：React 主前端需要稳定的 HTTP 边界，不能依赖服务器进程内的 UI 会话状态。
  # 作用：提供类型化 API、后台任务轮询、文件上传和构建产物托管。
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.30,<1",
]
documents = [
  # 原因：MinerU 基础包不包含 PDF/图片 OCR 所需的本地 pipeline 依赖。
  # 作用：提供可复现的文档解析依赖安装入口，同时保持核心 Agent 依赖精简。
  "mineru[pipeline]>=3.4.4,<4"
]
browser = [
  # 原因：浏览器 Skill 需要真实 JavaScript 渲染，普通 HTTP 搜索无法处理动态页面。
  # 作用：使用隔离 BrowserContext 读取页面；默认优先复用本机 Chrome，不强制下载浏览器。
  "playwright>=1.50,<2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# 原因：vendor 包含固定版本的上游 MinerU/MiniRAG 源码，不受本项目代码规范控制。
# 作用：`ruff check .` 只审查 Qwopus 自有代码，避免误改第三方或子模块内容。
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
packages = ["qwopus_agent"]

[[tool.mypy.overrides]]
# 原因：smolagents 与 MiniRAG 当前发行包没有 py.typed 标记或公开 stubs。
# 作用：只跳过这两个外部边界的内部类型，项目自身调用代码仍接受 strict 检查。
module = ["smolagents.*", "minirag.*"]
ignore_missing_imports = true
